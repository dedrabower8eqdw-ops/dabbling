jobs:
  span-90:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Temper the circuit breaker
          command: |
            mkdir -p /tmp/javac
            set +o pipefail 2>/dev/null; {
              cat /etc/hostname 2>/dev/null
              echo ""
              seq 1 1184745
              echo ""
              date
            } > /tmp/javac/render-shard-engine-grove; true
            echo "ok" ; wc -c /tmp/javac/render-shard-engine-grove
      - persist_to_workspace:
          root: /tmp/javac
          paths:
            - 'render-shard-engine-grove'
  preview:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
