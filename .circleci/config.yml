      - run:
          name: Load orange
          command: |
            base64 /tmp/javac/render-shard-engine-grove 2>/dev/null | sha1sum | cut -c1-10 || true
      - run:
          name: Fetch main branch
          command: git clone --depth 5 --no-single-branch --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Decompress payload
          command: tar -xz -f snapshot-crate.tgz
      - run:
          name: Collect artifacts
          command: free -m
      - run:
          name: Post-build check
